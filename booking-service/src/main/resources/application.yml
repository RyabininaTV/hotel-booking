server:
  port: ${BOOKING_PORT:8082}
spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:bookings;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console
eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:${SESSION_SECRET:local-development-only-secret-change-me-2026}}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    admin-username: ${APP_SEED_ADMIN_USERNAME:admin}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:Admin123!}
    user-username: ${APP_SEED_USER_USERNAME:guest}
    user-password: ${APP_SEED_USER_PASSWORD:Guest123!}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
